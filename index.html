<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FRUTI KRUTИ</title>
<style>
:root{--bg:#070b12;--panel:#101722;--panel2:#151e2b;--line:#253246;--text:#f6f8fb;--muted:#8d99aa;--yellow:#ffd43d;--green:#4ee38a;--red:#ff4f63;--blue:#4c9cff}*{box-sizing:border-box}html,body{margin:0;background:#05070b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{width:100%;max-width:540px;min-height:100vh;margin:auto;background:radial-gradient(1000px 500px at 50% -20%,#18243a 0,#080c13 55%);padding-bottom:94px;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;position:sticky;top:0;z-index:20;background:#080d15dd;backdrop-filter:blur(18px);border-bottom:1px solid #172131}.logo{font-weight:950;letter-spacing:-.4px}.balance{padding:9px 12px;border:1px solid #303b4c;border-radius:14px;background:#131b27;color:var(--yellow);font-weight:900;box-shadow:0 4px 18px #0004}.hero{margin:14px;padding:20px 18px;height:170px;border-radius:25px;position:relative;overflow:hidden;background:linear-gradient(135deg,#18283d,#101722 58%,#1c2430);border:1px solid #29384d;box-shadow:0 16px 45px #0006}.hero:before{content:"";position:absolute;width:210px;height:210px;right:-65px;top:-70px;border-radius:50%;background:#4c9cff22;filter:blur(4px)}.hero h1{margin:0;font-size:30px;letter-spacing:-1.2px}.hero p{margin:7px 0;color:#aab6c7}.heroPlane{position:absolute;right:18px;bottom:22px;font-size:58px;filter:drop-shadow(0 10px 10px #0008);animation:heroFly 3.2s ease-in-out infinite}.heroStars{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:37px 37px;opacity:.12;animation:stars 8s linear infinite}.sectionHead{display:flex;justify-content:space-between;align-items:center;padding:4px 15px 10px}.sectionHead h3{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}.card{min-height:142px;padding:13px;border-radius:20px;border:1px solid #202d3e;background:linear-gradient(145deg,#131c28,#0d131c);color:#fff;text-align:left;position:relative;overflow:hidden;box-shadow:0 10px 24px #0004;transition:.15s}.card:active{transform:scale(.965)}.card .icon{font-size:48px;display:block;filter:drop-shadow(0 7px 9px #0008);animation:float 2.6s ease-in-out infinite}.card b{display:block;margin-top:8px;font-size:16px}.muted{font-size:12px;color:var(--muted)}.nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#080d15ed;border-top:1px solid #1d2938;backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#7e8999;font-size:11px;font-weight:700}.nav button.active{color:var(--yellow)}.nav span{display:block;font-size:23px;margin-bottom:2px}.screen{padding:8px 14px}.back{border:1px solid #253246;background:#111a25;color:#fff;border-radius:13px;padding:9px 12px}.titleRow{display:flex;align-items:center;justify-content:space-between;margin:10px 0}.titleRow h2{margin:0;font-size:23px}.panel{background:linear-gradient(145deg,#111a26,#0c121a);border:1px solid #223044;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 12px 30px #0005}.input{width:100%;margin:7px 0;padding:13px 14px;border-radius:14px;border:1px solid #2b394d;background:#080e16;color:#fff;outline:0}.primary{width:100%;padding:14px;border:0;border-radius:15px;background:linear-gradient(180deg,#ffe36b,#ffc92f);color:#141414;font-weight:950;box-shadow:0 8px 22px #dcae2d33}.primary:active{transform:scale(.985)}.status{text-align:center;color:#aab5c4;min-height:24px;margin:10px 0}.big{text-align:center;font-size:52px;font-weight:950;letter-spacing:-2px}.back:active{transform:scale(.97)}
/* CRASH */.crash{height:310px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#111d2f,#0b1119);border:1px solid #26364c}.crashGrid{position:absolute;inset:-30%;background:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:42px 42px;transform:perspective(320px) rotateX(62deg) translateY(55px);transform-origin:center bottom}.crashGlow{position:absolute;width:260px;height:260px;border-radius:50%;background:#4c9cff18;filter:blur(35px);left:25%;bottom:10%}.crashTrail{position:absolute;left:-20%;bottom:48px;width:140%;height:4px;background:linear-gradient(90deg,transparent,#ffd43d);transform:rotate(-16deg);transform-origin:left;opacity:0}.crashPlane{position:absolute;left:7%;bottom:43px;font-size:51px;opacity:0;filter:drop-shadow(0 8px 10px #0009)}.crash.running .crashPlane{opacity:1;animation:planeRun var(--dur) linear forwards}.crash.running .crashTrail{opacity:1;animation:trailRun var(--dur) linear forwards}.crash.crashed .crashPlane{opacity:1;animation:planeCrash .85s ease-in forwards}.crash.crashed .crashTrail{background:#ff4f63;opacity:1}.cashout{margin-top:8px;background:linear-gradient(180deg,#5af09a,#36ce77)}
/* MINES */.mineGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.mineCell{aspect-ratio:1;border:0;border-radius:12px;background:linear-gradient(145deg,#1a2635,#121b26);color:#fff;font-size:23px;box-shadow:inset 0 -4px 0 #0a1018;transition:.12s}.mineCell.open{background:radial-gradient(circle,#28425a,#172431);animation:flip .32s}.mineCell.bomb{background:radial-gradient(circle,#7c2634,#35131b);animation:explode .55s}.mineCell:active{transform:scale(.92)}
/* FIGHT */.fight{height:320px;position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2d3c50,#111824 62%,#090e15);border:1px solid #2b3b50}.cage{position:absolute;left:7%;right:7%;top:55px;bottom:20px;border:5px solid #596a7f;border-radius:50% 50% 30% 30%;box-shadow:0 0 0 10px #101822,0 0 35px #000 inset}.rope{position:absolute;left:7%;right:7%;height:3px;background:#7e8fa5;opacity:.65}.r1{top:105px}.r2{top:155px}.r3{top:205px}.fighter{position:absolute;bottom:44px;font-size:86px;z-index:3;filter:drop-shadow(0 12px 8px #000a)}.fighter.a{left:13%}.fighter.b{right:13%;transform:scaleX(-1)}.fight.started .fighter.a{animation:attackA 1.25s infinite}.fight.started .fighter.b{animation:attackB 1.25s infinite}.fight.hitA .fighter.a{animation:hitA .35s}.fight.hitB .fighter.b{animation:hitB .35s}.round{position:absolute;top:15px;left:0;right:0;text-align:center;font-size:14px;color:#aab5c4;font-weight:800}.versus{position:absolute;top:25px;left:0;right:0;text-align:center;color:var(--yellow);font-size:24px;font-weight:950}.hpRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.hpbar{height:9px;background:#273343;border-radius:9px;overflow:hidden}.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#49e58a,#9affb9);transition:.35s}.hpbar.red i{background:linear-gradient(90deg,#ff465c,#ff8a98)}
/* PLINKO */.plinko{height:360px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(#111b28,#0a1119);border:1px solid #243247}.peg{position:absolute;width:8px;height:8px;background:#8291a4;border-radius:50%;box-shadow:0 0 8px #8291a455}.plinkBall{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--yellow);box-shadow:0 0 18px #ffd43d;left:calc(50% - 9px);top:9px;z-index:3}.plinkBall.drop{animation:plinkDrop 2.7s cubic-bezier(.25,.75,.5,1) forwards}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{height:110px;border-radius:17px;background:linear-gradient(#111a25,#070c12);border:2px solid #2a3a4f;display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden}.reels.spin .reel{animation:reel .55s 4}
/* CASE */.caseStage{height:235px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#49351b,#111923 60%);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.case{font-size:105px;filter:drop-shadow(0 18px 12px #0009)}.caseStage.opening .case{animation:caseOpen 1.1s ease-in-out}.reward{font-size:22px;text-align:center;color:var(--yellow);font-weight:900;min-height:30px;margin:9px}
/* PICKAXE */.rock{height:250px;border-radius:20px;background:radial-gradient(circle,#2c3a4b,#0b1119);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.rock .stone{font-size:105px;filter:drop-shadow(0 14px 9px #0009)}.pick{position:absolute;font-size:95px;transform:translate(70px,-30px) rotate(-35deg);filter:drop-shadow(0 12px 7px #0009)}.rock.mining .pick{animation:pickHit .38s 3}.rock.cracked .stone{animation:rockCrack .5s}
/* JUMP */.jump{height:340px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(#14283e,#0a111a)}.cloud{position:absolute;color:#a9c2dd22;font-size:60px;animation:cloud 8s linear infinite}.pepe{position:absolute;bottom:28px;left:20%;font-size:66px;filter:drop-shadow(0 10px 8px #0008)}.jump.go .pepe{animation:jump .95s ease-in-out}.platform{position:absolute;height:10px;border-radius:9px;background:#7f91a7;box-shadow:0 4px 0 #37475a}.score{position:absolute;top:12px;right:14px;font-weight:950;color:var(--yellow)}
/* PVP */.pvpArena{height:280px;border-radius:20px;background:radial-gradient(circle,#253c32,#0d1514);position:relative;overflow:hidden;border:1px solid #284b3b}.pvpArena:after{content:"";position:absolute;left:8%;right:8%;bottom:26px;height:7px;background:#405b4c;border-radius:50%}.pvpChar{position:absolute;bottom:31px;font-size:82px;filter:drop-shadow(0 10px 7px #0009)}.pvp1{left:13%}.pvp2{right:13%;transform:scaleX(-1)}.pvpArena.started .pvp1{animation:pvpA 1s infinite}.pvpArena.started .pvp2{animation:pvpB 1s infinite}
/* common */.conf{position:fixed;top:-20px;width:8px;height:14px;z-index:100;animation:conf 1.5s linear forwards}.toast{position:fixed;z-index:90;left:50%;bottom:95px;transform:translate(-50%,20px);background:#182333;border:1px solid #2c3b50;padding:11px 15px;border-radius:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes heroFly{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(-28px,-18px) rotate(-3deg)}}@keyframes stars{to{transform:translateY(37px)}}@keyframes float{50%{transform:translateY(-7px) rotate(-2deg)}}@keyframes planeRun{0%{left:6%;bottom:38px;transform:rotate(-5deg)}30%{left:31%;bottom:80px;transform:rotate(-10deg)}60%{left:61%;bottom:135px;transform:rotate(-15deg)}100%{left:95%;bottom:205px;transform:rotate(-20deg)}}@keyframes trailRun{to{transform:rotate(-16deg) translateY(-175px)}}@keyframes planeCrash{0%{left:95%;bottom:205px;transform:rotate(-20deg)}100%{left:83%;bottom:25px;transform:rotate(82deg);opacity:0}}@keyframes flip{0%{transform:rotateY(90deg) scale(.7)}100%{transform:rotateY(0) scale(1)}}@keyframes explode{0%{transform:scale(1)}35%{transform:scale(1.3);filter:brightness(2.2)}100%{transform:scale(1)}}@keyframes attackA{0%,100%{transform:translateX(0)}45%{transform:translateX(78px) rotate(-12deg)}60%{transform:translateX(0)}}@keyframes attackB{0%,100%{transform:scaleX(-1) translateX(0)}45%{transform:scaleX(-1) translateX(78px) rotate(-12deg)}60%{transform:scaleX(-1) translateX(0)}}@keyframes hitA{50%{transform:translateX(-24px) rotate(12deg)}}@keyframes hitB{50%{transform:scaleX(-1) translateX(-24px) rotate(12deg)}}@keyframes plinkDrop{0%{left:calc(50% - 9px);top:7px}14%{left:43%;top:55px}27%{left:57%;top:105px}40%{left:44%;top:155px}53%{left:59%;top:205px}66%{left:43%;top:255px}80%{left:54%;top:305px}100%{left:48%;top:350px}}@keyframes reel{0%{transform:translateY(0);filter:blur(0)}45%{transform:translateY(-55px);filter:blur(3px)}100%{transform:translateY(0);filter:blur(0)}}@keyframes caseOpen{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.08)}65%{transform:rotate(-4deg) scale(1.12)}80%{transform:scale(1.3);filter:drop-shadow(0 0 30px #ffd43d)}}@keyframes pickHit{50%{transform:translate(10px,20px) rotate(30deg)}}@keyframes rockCrack{50%{transform:scale(1.14);filter:brightness(1.8)}}@keyframes jump{0%{transform:translateY(0) rotate(0)}42%{transform:translateY(-180px) rotate(-12deg)}75%{transform:translateY(-80px) rotate(9deg)}100%{transform:translateY(0)}}@keyframes cloud{to{transform:translateX(650px)}}@keyframes pvpA{0%,100%{transform:translateX(0)}45%{transform:translateX(65px) rotate(-10deg)}60%{transform:translateX(0)}}@keyframes pvpB{0%,100%{transform:scaleX(-1) translateX(0)}45%{transform:scaleX(-1) translateX(65px) rotate(-10deg)}60%{transform:scaleX(-1) translateX(0)}}@keyframes conf{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body><div class="app"><header class="top"><div class="logo">🍓 FRUTI KRUTИ</div><div class="balance">⭐ <span id="bal">1000</span></div></header><main id="content"></main><div id="toast" class="toast"></div><nav class="nav"><button data-n="home" class="active">🏠<span>Главная</span></button><button data-n="cases">🎁<span>Кейсы</span></button><button data-n="leaders">🏆<span>Лидеры</span></button><button data-n="profile">👤<span>Профиль</span></button></nav></div>
<script>
const C=document.getElementById('content'),BAL=document.getElementById('bal');let balance=Number(localStorage.getItem('frutiBalance')||1000),timer=null;BAL.textContent=balance;
const games=[['crash','🚀','Crash','Самолёт летит до краша'],['mines','💣','Mines','Найди драгоценности'],['ufc','🥊','UFC','Смотри бой двух бойцов'],['pvp','⚔️','PVP','Дуэль один на один'],['pick','⛏️','Pickaxe','Ударь по камню'],['plinko','🟡','Plinko','Шарик падает по пегам'],['slots','🎰','MineSlot','Три барабана'],['case','🎁','Case','Открой награду'],['jump','🐸','Pepe Jump','Прыгни как можно выше']];
function save(){localStorage.setItem('frutiBalance',balance);BAL.textContent=balance}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function fx(){for(let i=0;i<55;i++){let e=document.createElement('i');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.35+'s';e.style.background=`hsl(${Math.random()*360} 90% 65%)`;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}
function bet(value=10){let b=Number(value);if(!b||b<1||b>balance){toast('Недостаточно ⭐');return 0}balance-=b;save();return b}function betPanel(label='Ставка'){return `<div class="panel"><div class="muted">${label}</div><input class="input" id="stake" type="number" min="1" value="10"><div class="muted">Демо-баланс: ⭐ ${balance}</div></div>`}
function shell(title,icon,body){C.innerHTML=`<section class="screen"><button class="back" onclick="home()">← Назад</button><div class="titleRow"><h2>${icon} ${title}</h2><div class="balance">⭐ ${balance}</div></div>${body}</section>`}
function home(){C.innerHTML=`<section class="hero"><div class="heroStars"></div><h1>Играй. Побеждай.</h1><p>Живые мини-игры FRUTI KRUTИ</p><div class="heroPlane">✈️</div></section><div class="sectionHead"><h3>🔥 Лучшие игры</h3><span class="muted">9 игр</span></div><div class="grid">${games.map(g=>`<button class="card" onclick="openGame('${g[0]}')"><span class="icon">${g[1]}</span><b>${g[2]}</b><span class="muted">${g[3]}</span></button>`).join('')}</div>`}
function openGame(g){({crash,mines:mine,ufc:()=>fight('UFC','🥊'),pvp:()=>fight('PVP','⚔️'),pick:pickaxe,plinko,slots,case:caseGame,jump}[g])()}
function crash(){shell('Crash','🚀',`${betPanel()}<div class="panel"><div class="crash" id="crash"><div class="crashGrid"></div><div class="crashGlow"></div><div class="crashTrail"></div><div class="crashPlane">✈️</div></div><div class="big" id="mult">1.00x</div><div class="status" id="cs">Самолёт стоит на старте</div><button class="primary" id="crashBtn" onclick="startCrash()">🚀 Поставить и взлететь</button><button class="primary cashout" id="cashBtn" onclick="cashOut()" style="display:none">💰 Забрать выигрыш</button></div>`)}
let crashBet=0,crashM=1,crashAt=0,crashLive=false;function startCrash(){if(crashLive)return;crashBet=bet(document.getElementById('stake').value);if(!crashBet)return;crashLive=true;crashM=1;crashAt=Number((1.35+Math.random()*4.8).toFixed(2));let a=document.getElementById('crash'),dur=Math.max(2.7,Math.min(8,crashAt*1.05));a.style.setProperty('--dur',dur+'s');a.classList.remove('crashed');void a.offsetWidth;a.classList.add('running');document.getElementById('cashBtn').style.display='block';document.getElementById('crashBtn').style.display='none';document.getElementById('cs').textContent='Самолёт летит — успей забрать!';timer=setInterval(()=>{crashM+=.025*crashM;document.getElementById('mult').textContent=crashM.toFixed(2)+'x';if(crashM>=crashAt)finishCrash(false)},80)}function finishCrash(win){clearInterval(timer);crashLive=false;let a=document.getElementById('crash');a.classList.remove('running');if(!win){a.classList.add('crashed');document.getElementById('cs').textContent='💥 КРАШ на '+crashAt.toFixed(2)+'x';toast('Ставка сгорела');}document.getElementById('cashBtn').style.display='none';document.getElementById('crashBtn').style.display='block'}function cashOut(){if(!crashLive)return;let win=Math.floor(crashBet*crashM);balance+=win;save();finishCrash(true);document.getElementById('cs').textContent='🎉 Забрано +'+win+' ⭐';fx()}
function mine(){shell('Mines','💣',`${betPanel()}<div class="panel"><div class="status" id="ms">5 мин • выбирай клетки</div><div class="mineGrid" id="mineGrid"></div><button class="primary" id="mineCash" style="margin-top:11px">💰 Забрать выигрыш</button></div>`);let set=new Set();while(set.size<5)set.add(Math.floor(Math.random()*25));let stake=0,opened=0,mult=1,dead=false;const grid=document.getElementById('mineGrid');for(let i=0;i<25;i++){let b=document.createElement('button');b.className='mineCell';b.onclick=()=>{if(dead||b.disabled)return;if(!stake){stake=bet(document.getElementById('stake').value);if(!stake)return}b.disabled=true;if(set.has(i)){dead=true;b.textContent='💣';b.classList.add('bomb');[...grid.children].forEach((x,j)=>{if(set.has(j))x.textContent='💣'});document.getElementById('ms').textContent='💥 Мина! Ставка потеряна';return}opened++;mult*=1.17;b.textContent='💎';b.classList.add('open');document.getElementById('ms').textContent='💎 Безопасно • '+mult.toFixed(2)+'x'};grid.appendChild(b)}document.getElementById('mineCash').onclick=()=>{if(!stake||dead||opened<1)return;let win=Math.floor(stake*mult);balance+=win;save();dead=true;document.getElementById('ms').textContent='🎉 +'+win+' ⭐';fx()}}
function fight(name,icon){shell(name,icon,`${betPanel()}<div class="panel"><div class="fight" id="fight"><div class="round">ROUND 1</div><div class="versus">VS</div><div class="cage"></div><div class="rope r1"></div><div class="rope r2"></div><div class="rope r3"></div><div class="fighter a" id="fa">🥷</div><div class="fighter b" id="fb">🥷</div></div><div class="hpRow"><div><div class="muted">PLAYER 1</div><div class="hpbar"><i id="hp1"></i></div></div><div><div class="muted">PLAYER 2</div><div class="hpbar red"><i id="hp2"></i></div></div></div><div class="status" id="fs">Сделай ставку и начни бой</div><button class="primary" onclick="startFight()">🥊 Начать бой</button></div>`)}
function startFight(){let s=bet(document.getElementById('stake').value);if(!s)return;let f=document.getElementById('fight'),a=100,b=100;f.classList.add('started');document.getElementById('fs').textContent='🔥 БОЙ ИДЁТ!';let t=setInterval(()=>{if(Math.random()<.52){b=Math.max(0,b-(7+Math.random()*15));f.classList.add('hitB');setTimeout(()=>f.classList.remove('hitB'),300)}else{a=Math.max(0,a-(7+Math.random()*15));f.classList.add('hitA');setTimeout(()=>f.classList.remove('hitA'),300)}document.getElementById('hp1').style.width=a+'%';document.getElementById('hp2').style.width=b+'%';if(a<=0||b<=0){clearInterval(t);f.classList.remove('started');let win=b<=0&&a>0;let prize=win?s*2:0;if(win)balance+=prize;save();document.getElementById('fs').textContent=win?'🏆 ПОБЕДА +'+prize+' ⭐':'💥 Поражение';if(win)fx()}},650)}
function plinko(){shell('Plinko','🟡',`${betPanel()}<div class="panel"><div class="plinko" id="plinko"><div class="plinkBall" id="plinkBall"></div></div><div class="status" id="pls">Шарик готов</div><button class="primary" onclick="dropPlinko()">🟡 Запустить шарик</button></div>`);let p=document.getElementById('plinko');for(let r=0;r<8;r++)for(let c=0;c<8;c++){let q=document.createElement('i');q.className='peg';q.style.left=(12+c*10.8+(r%2?5.4:0))+'%';q.style.top=(20+r*10.7)+'%';p.appendChild(q)}}function dropPlinko(){let s=bet(document.getElementById('stake').value);if(!s)return;let b=document.getElementById('plinkBall');b.classList.remove('drop');void b.offsetWidth;b.classList.add('drop');document.getElementById('pls').textContent='🟡 Шарик падает...';setTimeout(()=>{let m=[.2,.5,1,1.5,2,3][Math.floor(Math.random()*6)],w=Math.floor(s*m);balance+=w;save();document.getElementById('pls').textContent=m>=1?'🎉 '+m+'x • +'+w+' ⭐':'💥 '+m+'x';if(m>=2)fx()},2700)}
function slots(){shell('MineSlot','🎰',`${betPanel()}<div class="panel"><div class="slots" id="reels"><div class="reel">🍒</div><div class="reel">💎</div><div class="reel">7️⃣</div></div><div class="status" id="ss">Крути барабаны</div><button class="primary" onclick="spinSlots()">🎰 Крутить</button></div>`)}function spinSlots(){let s=bet(document.getElementById('stake').value);if(!s)return;let r=document.getElementById('reels');r.classList.add('spin');let arr=['🍒','💎','🍋','7️⃣','⭐','🍉'];setTimeout(()=>{r.classList.remove('spin');let vals=[...r.children].map(x=>{x.textContent=arr[Math.floor(Math.random()*arr.length)];return x.textContent});let w=vals.every(v=>v===vals[0])?s*8:vals.filter(v=>v==='7️⃣').length>=2?s*2:0;balance+=w;save();document.getElementById('ss').textContent=w?'🎉 +'+w+' ⭐':'Повезёт в следующий раз';if(w)fx()},2300)}
function caseGame(){shell('Case','🎁',`${betPanel()}<div class="panel"><div class="caseStage" id="caseStage"><div class="case">🎁</div></div><div class="reward" id="reward"></div><button class="primary" onclick="openCase()">🎁 Открыть кейс</button></div>`)}function openCase(){let s=bet(document.getElementById('stake').value);if(!s)return;let st=document.getElementById('caseStage');st.classList.add('opening');setTimeout(()=>{let w=Math.floor(s*(.5+Math.random()*7));balance+=w;save();document.getElementById('reward').textContent='🎉 Твоя награда: +'+w+' ⭐';fx()},1100)}
function pickaxe(){shell('Pickaxe','⛏️',`${betPanel()}<div class="panel"><div class="rock" id="rock"><div class="stone">🪨</div><div class="pick">⛏️</div></div><div class="status" id="ps">Ударь по камню</div><button class="primary" onclick="hitRock()">⛏️ Ударить</button></div>`)}function hitRock(){let s=bet(document.getElementById('stake').value);if(!s)return;let r=document.getElementById('rock');r.classList.add('mining');setTimeout(()=>r.classList.remove('mining'),1200);setTimeout(()=>r.classList.add('cracked'),300);setTimeout(()=>r.classList.remove('cracked'),850);let w=Math.floor(s*(1+Math.random()*3));balance+=w;save();document.getElementById('ps').textContent='💎 Камень расколот • +'+w+' ⭐';fx()}
function jump(){shell('Pepe Jump','🐸',`${betPanel()}<div class="panel"><div class="jump" id="jump"><div class="cloud" style="top:35px;left:-90px">☁️</div><div class="cloud" style="top:110px;left:25px;animation-delay:3s">☁️</div><div class="platform" style="left:8%;bottom:25px;width:31%"></div><div class="platform" style="left:54%;bottom:100px;width:31%"></div><div class="platform" style="left:19%;bottom:178px;width:29%"></div><div class="platform" style="left:60%;bottom:255px;width:26%"></div><div class="pepe">🐸</div><div class="score">SCORE 0</div></div><div class="status" id="js">Готов к прыжку</div><button class="primary" onclick="jumpNow()">🐸 Прыгнуть</button></div>`)}function jumpNow(){let s=bet(document.getElementById('stake').value);if(!s)return;let j=document.getElementById('jump');j.classList.remove('go');void j.offsetWidth;j.classList.add('go');setTimeout(()=>{let w=s*2;balance+=w;save();document.getElementById('js').textContent='🚀 Прыжок успешен • +'+w+' ⭐';fx()},950)}
function cases(){shell('Кейсы','🎁',`<div class="panel"><h3>FRUTI Case</h3><p class="muted">Открывай кейсы в демо-режиме.</p><button class="primary" onclick="caseGame()">🎁 Открыть</button></div>`)}function leaders(){shell('Лидеры','🏆',`<div class="panel"><h3>🏆 ТОП игроков</h3><p>🥇 FRUTI — 98 420 ⭐</p><p>🥈 KRUTI — 76 210 ⭐</p><p>🥉 PEPE — 55 900 ⭐</p></div>`)}function profile(){shell('Профиль','👤',`<div class="panel" style="text-align:center"><div style="font-size:78px">👤</div><h2>Игрок</h2><div class="big">⭐ ${balance}</div><div class="muted">Демо-баланс хранится на устройстве</div></div>`)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');({home,cases,leaders,profile}[b.dataset.n])()});home();
</script></body></html>
