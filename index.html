<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FRUTI KRUTИ</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d14;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;overflow-x:hidden}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#0c111a,#070a10);padding-bottom:80px}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;background:#0b1018ee;backdrop-filter:blur(12px);z-index:5}.brand{font-weight:900;font-size:20px}.bal{background:#161e2a;padding:8px 12px;border-radius:14px;color:#ffd84d;font-weight:800}.hero{margin:10px 14px;padding:20px;border-radius:24px;background:radial-gradient(circle at 75% 25%,#28456f,#121b2b 45%,#11151d);overflow:hidden;position:relative}.hero h1{font-size:28px;margin:0 0 6px}.hero p{margin:0;color:#aeb8c8}.planeMini{position:absolute;right:22px;bottom:22px;font-size:48px;animation:flymini 3s ease-in-out infinite}.tabs{display:flex;gap:8px;padding:0 14px 12px}.tab{border:0;background:#151c27;color:#aab4c4;padding:10px 14px;border-radius:12px}.tab.on{background:#ffd84d;color:#111;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}.card{border:1px solid #1d2837;background:#121923;border-radius:18px;padding:14px;min-height:118px;text-align:left;color:white;position:relative;overflow:hidden;transition:.2s}.card:active{transform:scale(.97)}.ico{font-size:38px;display:block;animation:float 2.5s ease-in-out infinite}.card b{display:block;margin-top:7px}.muted{color:#8995a7;font-size:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b1018f5;backdrop-filter:blur(15px);border-top:1px solid #1d2633;z-index:10}.nav button{background:none;border:0;color:#8995a7;font-size:12px}.nav button.on{color:#ffd84d}.nav span{display:block;font-size:22px}.screen{padding:0 14px}.back{border:0;background:#171f2b;color:#fff;padding:9px 12px;border-radius:12px;margin:4px 0 12px}.gameTitle{display:flex;align-items:center;justify-content:space-between}.gameTitle h2{margin:4px 0 12px}.panel{background:#111924;border:1px solid #202c3b;border-radius:22px;padding:14px;margin-bottom:12px}.primary{width:100%;border:0;border-radius:15px;padding:13px;background:#ffd84d;color:#111;font-weight:900}.danger{background:#ff4d62;color:#fff}.input{width:100%;padding:13px;border:1px solid #293648;background:#0b1119;color:white;border-radius:13px;margin:8px 0}.row{display:flex;gap:8px}.row>*{flex:1}.big{font-size:48px;font-weight:950;text-align:center}.status{text-align:center;color:#9ca9ba;min-height:22px}
/* crash */.crashArena{height:260px;border-radius:18px;background:linear-gradient(180deg,#111c2d,#0b1119);position:relative;overflow:hidden;border:1px solid #26354a}.crashGrid{position:absolute;inset:0;background:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:35px 35px;transform:skewY(-8deg);}.crashLine{position:absolute;left:-10%;bottom:20px;width:120%;height:180px;border-top:4px solid #ffd84d;border-radius:50%;transform:rotate(-13deg);animation:none;filter:drop-shadow(0 0 8px #ffd84d)}.crashPlane{position:absolute;font-size:44px;left:12%;bottom:42px;animation:none;filter:drop-shadow(0 5px 8px #000)}.flying .crashPlane{animation:planePath 4.5s linear forwards}.flying .crashLine{animation:lineRise 4.5s linear forwards}.crashed .crashPlane{animation:crashFall 1s forwards}.crashed .crashLine{border-color:#ff4d62}
/* mines */.mines{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.mine{aspect-ratio:1;border:0;border-radius:11px;background:#1a2431;color:white;font-size:24px;box-shadow:inset 0 -3px #0c1118}.mine.open{animation:flip .35s; background:#243244}.mine.bomb{background:#4b1822;animation:boom .45s}
/* fighters */.fightArena{height:270px;position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(circle at center,#28374b,#111722 60%);border:1px solid #29384b}.ring{position:absolute;inset:45px 20px 28px;border:4px solid #67778e;border-radius:50%;box-shadow:0 0 0 12px #1a2533,0 0 30px #000 inset}.fighter{position:absolute;bottom:45px;font-size:72px;transition:transform .2s}.f1{left:15%}.f2{right:15%;transform:scaleX(-1)}.fighting .f1{animation:punch1 1.2s infinite}.fighting .f2{animation:punch2 1.2s infinite}.hit{animation:hit .3s!important}.vs{text-align:center;font-size:26px;font-weight:900;position:absolute;top:15px;left:0;right:0;color:#ffd84d}.hp{height:9px;background:#293444;border-radius:9px;overflow:hidden}.hp i{display:block;height:100%;background:#5ee67d;width:100%;transition:.3s}
/* plinko */.plinko{height:330px;position:relative;overflow:hidden;background:#0e1520;border-radius:18px}.peg{position:absolute;width:7px;height:7px;background:#8492a5;border-radius:50%}.ball{position:absolute;width:18px;height:18px;border-radius:50%;background:#ffd84d;box-shadow:0 0 15px #ffd84d;left:calc(50% - 9px);top:6px;display:none}.ball.drop{display:block;animation:dropball 2.8s cubic-bezier(.3,.8,.5,1) forwards}
/* slots */.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.reel{height:100px;background:#0b1119;border:2px solid #334154;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:52px;overflow:hidden}.spin .reel{animation:reelspin .55s 4}
/* case */.casebox{height:190px;display:flex;align-items:center;justify-content:center;font-size:100px;background:radial-gradient(circle,#3a2b18,#111924);border-radius:20px}.opening .casebox{animation:caseShake .5s 3}.reward{font-size:28px;text-align:center;color:#ffd84d;min-height:35px}
/* jump/pick */.jumpArena{height:300px;background:linear-gradient(#18253a,#0e1622);border-radius:18px;position:relative;overflow:hidden}.pepe{position:absolute;bottom:28px;left:25%;font-size:62px}.jumping .pepe{animation:jump 1s infinite}.platform{position:absolute;height:10px;background:#5b6d83;border-radius:8px}.pickArena{height:230px;display:flex;align-items:center;justify-content:center;font-size:100px;background:radial-gradient(circle,#243245,#0d131c);border-radius:18px}.mining .pick{animation:pick .35s infinite}
/* confetti */.conf{position:fixed;top:-20px;width:8px;height:14px;z-index:30;animation:confetti 1.4s linear forwards}
@keyframes flymini{50%{transform:translate(-25px,-12px) rotate(-5deg)}100%{transform:translate(0,0)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes planePath{0%{left:8%;bottom:30px;transform:rotate(-5deg)}35%{left:32%;bottom:70px;transform:rotate(-9deg)}70%{left:62%;bottom:125px;transform:rotate(-13deg)}100%{left:94%;bottom:190px;transform:rotate(-18deg)}}@keyframes lineRise{to{transform:rotate(-13deg) translateY(-120px)}}@keyframes crashFall{to{transform:translate(50px,100px) rotate(75deg);opacity:0}}@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}@keyframes boom{40%{transform:scale(1.2);filter:brightness(2)}100%{transform:scale(1)}}@keyframes punch1{0%,100%{transform:translateX(0)}45%{transform:translateX(80px) rotate(-12deg)}60%{transform:translateX(0)}}@keyframes punch2{0%,100%{transform:scaleX(-1) translateX(0)}45%{transform:scaleX(-1) translateX(70px) rotate(12deg)}60%{transform:scaleX(-1) translateX(0)}}@keyframes hit{50%{transform:translateX(30px) rotate(15deg)}100%{transform:translateX(0)}}@keyframes dropball{0%{top:6px;left:calc(50% - 9px)}12%{top:50px;left:45%}24%{top:95px;left:56%}36%{top:140px;left:43%}48%{top:185px;left:60%}60%{top:225px;left:40%}75%{top:265px;left:52%}100%{top:305px;left:45%}}@keyframes reelspin{50%{transform:translateY(-25px) rotateX(30deg);filter:blur(2px)}}@keyframes caseShake{25%{transform:rotate(-7deg) scale(1.04)}75%{transform:rotate(7deg) scale(1.04)}}@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-150px) rotate(-10deg)}70%{transform:translateY(-70px) rotate(8deg)}}@keyframes pick{50%{transform:rotate(-35deg) translate(-15px,8px)}100%{transform:rotate(15deg)}}@keyframes confetti{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body><div class="app" id="app"><div class="top"><div class="brand">🍓 FRUTI KRUTИ</div><div class="bal">⭐ <span id="balance">1000</span></div></div><div id="content"></div><nav class="nav"><button data-nav="home" class="on">🏠<span>Главная</span></button><button data-nav="cases">🎁<span>Кейсы</span></button><button data-nav="leaders">🏆<span>Лидеры</span></button><button data-nav="profile">👤<span>Профиль</span></button></nav></div><script>
const $=s=>document.querySelector(s), content=$('#content'); let balance=+localStorage.frutiBalance||1000; let current='home'; $('#balance').textContent=balance;
function save(){localStorage.frutiBalance=balance;$('#balance').textContent=balance}
function confetti(){for(let i=0;i<45;i++){let x=document.createElement('i');x.className='conf';x.style.left=Math.random()*100+'vw';x.style.animationDelay=Math.random()*.4+'s';x.style.transform=`rotate(${Math.random()*360}deg)`;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}}
const games=[['crash','🚀','Crash','Самолёт летит вверх'],['mines','💣','Mines','Открой безопасные клетки'],['pvp','🟢','PVP','Бой один на один'],['ufc','🥊','UFC','Два бойца в клетке'],['pickaxe','⛏️','Pickaxe','Добывай награды'],['plinko','🟡','Plinko','Шарик падает по пегам'],['slots','🎰','MineSlot','Крути барабаны'],['case','🎁','Case','Открой кейс'],['jump','🐸','Pepe Jump','Прыгай выше']];
function home(){content.innerHTML=`<section class="hero"><h1>Играй. Побеждай.</h1><p>Мини-игры FRUTI KRUTИ</p><div class="planeMini">✈️</div></section><div class="tabs"><button class="tab on">🔥 Лучшие</button><button class="tab">⚡ Быстрые</button></div><div class="grid">${games.map(g=>`<button class="card" onclick="openGame('${g[0]}')"><span class="ico">${g[1]}</span><b>${g[2]}</b><span class="muted">${g[3]}</span></button>`).join('')}</div>`}
function layout(title,icon,body){content.innerHTML=`<section class="screen"><button class="back" onclick="goHome()">← Назад</button><div class="gameTitle"><h2>${icon} ${title}</h2><span class="bal">⭐ ${balance}</span></div>${body}</section>`}
function betBox(){return `<div class="panel"><label>Ставка</label><input class="input" id="bet" type="number" min="1" value="10"><button class="primary" onclick="takeBet()">Поставить ⭐</button></div>`}
function takeBet(){let b=+$('bet').value;if(!b||b<1||b>balance){alert('Недостаточно Stars');return null}balance-=b;save();return b}
function crash(){layout('Crash','🚀',`${betBox()}<div class="panel"><div class="crashArena" id="crashArena"><div class="crashGrid"></div><div class="crashLine"></div><div class="crashPlane">✈️</div></div><div class="big" id="mult">1.00x</div><div class="status" id="cstatus">Нажми «Поставить» чтобы запустить самолёт</div><button class="primary" id="cash" style="display:none;margin-top:10px" onclick="cashout()">Забрать выигрыш</button></div>`);let started=false,m=1,crashAt=1.8,timer;
window.takeBet=()=>{if(started)return;let b=+$('#bet').value;if(!b||b>balance)return alert('Недостаточно Stars');balance-=b;save();started=true;m=1;crashAt=(1.25+Math.random()*4).toFixed(2);$('#crashArena').classList.add('flying');$('#cash').style.display='block';$('#cstatus').textContent='Самолёт летит — успей забрать!';timer=setInterval(()=>{m+=.03;$('#mult').textContent=m.toFixed(2)+'x';if(m>=crashAt){clearInterval(timer);$('#crashArena').classList.remove('flying');$('#crashArena').classList.add('crashed');$('#cash').style.display='none';$('#cstatus').textContent='💥 КРАШ на '+crashAt+'x';started=false}},80)};
window.cashout=()=>{if(!started)return;clearInterval(timer);started=false;let win=Math.floor((+$('mult').textContent)*+$('bet').value);balance+=win;save();$('#cash').style.display='none';$('#cstatus').textContent='🎉 Забрано +'+win+' ⭐';confetti()}}
function mines(){layout('Mines','💣',`${betBox()}<div class="panel"><div class="status" id="mstatus">5 мин — открой клетку</div><div class="mines" id="mines"></div><button class="primary" id="mCash" style="margin-top:10px">Забрать выигрыш</button></div>`);let cells=$('#mines'),mineSet=new Set();while(mineSet.size<5)mineSet.add(Math.floor(Math.random()*25));let opened=0,mult=1,b=0;for(let i=0;i<25;i++){let x=document.createElement('button');x.className='mine';x.onclick=()=>{if(x.disabled)return;if(!b){b=takeBet();if(!b)return}x.disabled=true;if(mineSet.has(i)){x.textContent='💣';x.classList.add('bomb');$('#mstatus').textContent='💥 Мина! Ставка проиграна';document.querySelectorAll('.mine').forEach((q,j)=>{if(mineSet.has(j))q.textContent='💣'});return}else{opened++;mult*=1.18;x.textContent='💎';x.classList.add('open');$('#mstatus').textContent='Безопасно • '+mult.toFixed(2)+'x'}};cells.appendChild(x)}$('#mCash').onclick=()=>{if(!b||opened<1)return;let win=Math.floor(b*mult);balance+=win;save();$('#mstatus').textContent='🎉 +'+win+' ⭐';confetti()}}
function fight(type){let name=type==='ufc'?'UFC':'PVP';layout(name,type==='ufc'?'🥊':'🟢',`${betBox()}<div class="panel"><div class="fightArena" id="fightArena"><div class="vs">VS</div><div class="ring"></div><div class="fighter f1">🥷</div><div class="fighter f2">🥷</div></div><div class="row"><div><div class="muted">Игрок 1</div><div class="hp"><i id="hp1"></i></div></div><div><div class="muted">Игрок 2</div><div class="hp"><i id="hp2"></i></div></div></div><div class="status" id="fstatus">Ставь и смотри бой</div><button class="primary" onclick="startFight()">Начать бой</button></div>`);window.startFight=()=>{let b=takeBet();if(!b)return;let a=100,c=100;$('#fightArena').classList.add('fighting');$('#fstatus').textContent='🥊 БОЙ НАЧАЛСЯ!';let t=setInterval(()=>{let hit=Math.random()<.5?1:2;if(hit===1)c-=Math.floor(8+Math.random()*18);else a-=Math.floor(8+Math.random()*18);$('#hp1').style.width=a+'%';$('#hp2').style.width=c+'%';let f=hit===1?$('.f2'):$('.f1');f.classList.add('hit');setTimeout(()=>f.classList.remove('hit'),300);if(a<=0||c<=0){clearInterval(t);$('#fightArena').classList.remove('fighting');let win=a>c;let prize=win?b*2:0;if(win)balance+=prize;save();$('#fstatus').textContent=win?'🏆 ПОБЕДА! +'+prize+' ⭐':'💥 Поражение';if(win)confetti()}},700)} }
function plinko(){layout('Plinko','🟡',`${betBox()}<div class="panel"><div class="plinko" id="plinko"><div class="ball" id="ball"></div></div><div class="status" id="pstatus">Шарик ждёт запуска</div><button class="primary" onclick="drop()">Запустить шарик</button></div>`);let p=$('#plinko');for(let r=0;r<7;r++)for(let c=0;c<7;c++){let q=document.createElement('i');q.className='peg';q.style.left=(15+c*11+(r%2?5.5:0))+'%';q.style.top=(35+r*35/7)+'%';p.appendChild(q)}window.drop=()=>{let b=takeBet();if(!b)return;$('#ball').classList.remove('drop');void $('#ball').offsetWidth;$('#ball').classList.add('drop');$('#pstatus').textContent='🟡 Шарик падает...';setTimeout(()=>{let mult=[0.3,.6,1,2,3][Math.floor(Math.random()*5)];let win=Math.floor(b*mult);balance+=win;save();$('#pstatus').textContent=mult>=1?'🎉 '+mult+'x • +'+win+' ⭐':'💥 '+mult+'x • проигрыш';if(mult>=2)confetti()},2800)} }
function slots(){layout('MineSlot','🎰',`${betBox()}<div class="panel"><div class="reels" id="reels"><div class="reel">🍒</div><div class="reel">💎</div><div class="reel">7️⃣</div></div><div class="status" id="sstatus">Крути барабаны</div><button class="primary" onclick="spin()">Крутить</button></div>`);window.spin=()=>{let b=takeBet();if(!b)return;$('#reels').classList.add('spin');setTimeout(()=>{$('#reels').classList.remove('spin');let arr=['🍒','💎','🍋','7️⃣','⭐'];let vals=[...document.querySelectorAll('.reel')].map(x=>x.textContent=arr[Math.floor(Math.random()*arr.length)]);let win=vals.every(v=>v===vals[0])?b*8:vals.filter(v=>v==='7️⃣').length===2?b*2:0;balance+=win;save();$('#sstatus').textContent=win?'🎉 ДЖЕКПОТ +'+win+' ⭐':'Попробуй ещё';if(win)confetti()},2300)} }
function caseGame(){layout('Case','🎁',`${betBox()}<div class="panel"><div class="casebox" id="casebox">🎁</div><div class="reward" id="reward"></div><button class="primary" onclick="openCase()">Открыть кейс</button></div>`);window.openCase=()=>{let b=takeBet();if(!b)return;$('#casebox').parentElement.classList.add('opening');setTimeout(()=>{let win=Math.floor(b*(.5+Math.random()*6));balance+=win;save();$('#reward').textContent='🎉 Ты получил '+win+' ⭐';confetti()},1700)} }
function pick(){layout('Pickaxe','⛏️',`${betBox()}<div class="panel"><div class="pickArena"><div class="pick">⛏️</div><span>🪨</span></div><div class="status" id="pickstatus">Бей по камню!</div><button class="primary" onclick="mine()">Ударить киркой</button></div>`);window.mine=()=>{let b=takeBet();if(!b)return;$('.pickArena').classList.add('mining');setTimeout(()=>$('.pickArena').classList.remove('mining'),500);let win=Math.floor(b*(1+Math.random()*3));balance+=win;save();$('#pickstatus').textContent='⛏️ Трещина! +'+win+' ⭐';confetti()}}
function jump(){layout('Pepe Jump','🐸',`${betBox()}<div class="panel"><div class="jumpArena" id="jump"><div class="platform" style="left:10%;bottom:20px;width:30%"></div><div class="platform" style="left:55%;bottom:90px;width:30%"></div><div class="platform" style="left:20%;bottom:165px;width:28%"></div><div class="pepe">🐸</div></div><div class="status" id="jstatus">Готов к прыжку</div><button class="primary" onclick="jumpNow()">Прыжок</button></div>`);window.jumpNow=()=>{let b=takeBet();if(!b)return;$('#jump').classList.add('jumping');setTimeout(()=>{$('#jump').classList.remove('jumping');let win=b*2;balance+=win;save();$('#jstatus').textContent='🐸 Высоко! +'+win+' ⭐';confetti()},1000)}}
function openGame(g){({crash,mines,pvp:()=>fight('pvp'),ufc:()=>fight('ufc'),pickaxe:pick,plinko,slots,case:caseGame,jump}[g])()}
function cases(){layout('Кейсы','🎁',`<div class="panel"><h3>🎁 FRUTI Case</h3><p class="muted">Открывай кейсы и получай Stars в демо-режиме.</p><button class="primary" onclick="caseGame()">Открыть кейс</button></div>`)}function leaders(){layout('Лидеры','🏆',`<div class="panel"><h3>🏆 Топ игроков</h3><p>🥇 FRUTI • 98 420 ⭐</p><p>🥈 KRUTI • 76 210 ⭐</p><p>🥉 PEPE • 55 900 ⭐</p></div>`)}function profile(){layout('Профиль','👤',`<div class="panel" style="text-align:center"><div style="font-size:70px">👤</div><h2>Игрок</h2><div class="big">⭐ ${balance}</div><p class="muted">Демо-баланс сохраняется на этом устройстве</p></div>`)}function goHome(){current='home';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.nav==='home'));home()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');({home, cases, leaders, profile}[b.dataset.nav])()});home();
</script></body></html>
